name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Construire, tester, verifier
        run: >
          ./gradlew --no-configuration-cache
          ktlintCheck detekt
          lintFossDebug
          testDebugUnitTest :core:model:test
          verifyRoborazziDebug
          assembleFossDebug
          assembleFossRelease
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
      - name: APK release non signee
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-non-signee
          path: app/build/outputs/apk/foss/release/*.apk

  dependances:
    # Analyse des vulnerabilites connues des dependances (outil libre OSV-Scanner).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.0
        with:
          scan-args: |-
            --recursive
            ./
        continue-on-error: true
